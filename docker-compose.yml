version: '3.8'

services:
  db:
    image: postgres:15
    container_name: signal_exchange_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: signal_exchange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: signal_exchange_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
