services:
  - type: web
    name: netrontrade-platform
    env: node
    region: singapore
    plan: free
    # generate client -> archive legacy wallet rows -> db push (package.json "build").
    # Steps are chained with &&, so an unreachable DB or a failed archive stops
    # the build before any destructive schema change.
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Neon Postgres connection string (Neon dashboard -> Connect). Use the
      # DIRECT (non "-pooler") URL, ending in ?sslmode=require, so
      # "prisma db push" in the build works.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_URL_PATH
        sync: false
      - key: APP_DOMAIN
        sync: false
      # OTP / password-reset email (server-only - set in the Render dashboard).
      # Recommended on Render: Brevo HTTP API (port 443, never blocked).
      # Verify netradeofficiall@gmail.com as a sender in Brevo first.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        value: "NEOTRADE <netradeofficiall@gmail.com>"
      # Only used when BREVO_API_KEY is NOT set (plain SMTP). Render's free plan
      # blocks ports 25/465/587, so Gmail SMTP only works on a paid instance.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Single platform-wide TRC20 receiving address (no parent/child wallets).
      - key: TRC20_RECEIVING_ADDRESS
        value: TFk6S5zkJKuFAb1QjbHDVr2Lv95oSSCYLN
      # Optional TronGrid API key for on-chain TXID verification (not a wallet key)
      - key: TRON_API_KEY
        sync: false

