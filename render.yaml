services:
  - type: web
    name: netrontrade-platform
    env: node
    region: singapore
    plan: free
    # generate client -> archive legacy wallet rows -> db push (package.json "build").
    # Steps are chained with &&, so an unreachable DB or a failed archive stops
    # the build before any destructive schema change.
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pql-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_URL_PATH
        sync: false
      - key: APP_DOMAIN
        sync: false
      # SMTP / registration OTP email (server-only - set in the Render dashboard).
      # Free plan blocks 25/465/587: use port 2525 with SMTP_SECURE=false (STARTTLS).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Verified sender, e.g. NETRONTRADE <no-reply@mydomain.com>
      - key: SMTP_FROM
        sync: false
      # Single platform-wide TRC20 receiving address (no parent/child wallets).
      - key: TRC20_RECEIVING_ADDRESS
        value: TFk6S5zkJKuFAb1QjbHDVr2Lv95oSSCYLN
      # Optional TronGrid API key for on-chain TXID verification (not a wallet key)
      - key: TRON_API_KEY
        sync: false

databases:
  - name: pql-db
    databaseName: pql
    user: pql_admin
    plan: free
    region: singapore
